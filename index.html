<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global LPR Mind Map</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1a2540;
    --panel-border: #2c3a5e;
    --text: #f8fafc;
    --text-dim: #94a3b8;
    --hub: #6366f1;
    --waiting: #64748b;
    --collecting: #3b82f6;
    --training: #f59e0b;
    --ready: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    max-width: 1100px;
    margin: 0 auto 2rem;
    text-align: center;
  }
  header h1 {
    font-size: 1.7rem;
    margin: 0 0 0.4rem;
  }
  header p {
    color: var(--text-dim);
    margin: 0;
    font-size: 0.9rem;
  }
  header a {
    color: #93c5fd;
  }

  .hub {
    max-width: 320px;
    margin: 0 auto 1.5rem;
    background: var(--hub);
    border-radius: 14px;
    padding: 1rem 1.4rem;
    text-align: center;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(99,102,241,0.35);
  }
  .bus-line {
    max-width: 1100px;
    height: 24px;
    margin: 0 auto;
    border-top: 2px solid var(--panel-border);
    position: relative;
  }

  .legend {
    max-width: 1100px;
    margin: 0 auto 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
  }
  .legend span {
    font-size: 0.78rem;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    color: #0f172a;
    font-weight: 600;
  }

  .board {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }

  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 1rem;
  }
  .card::before {
    content: "";
    position: absolute;
    top: -24px;
    left: 50%;
    width: 2px;
    height: 24px;
    background: var(--panel-border);
  }
  @media (max-width: 700px) {
    .bus-line { display: none; }
    .card::before { display: none; }
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
  }
  .card-title {
    font-weight: 700;
    font-size: 1rem;
    line-height: 1.3;
  }
  .remove-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0.1rem 0.3rem;
  }
  .remove-btn:hover { color: #f87171; }

  select.status {
    margin-top: 0.6rem;
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 0.4rem 0.5rem;
    font-size: 0.82rem;
    font-weight: 600;
    color: #0f172a;
    cursor: pointer;
  }
  select.status.waiting { background: var(--waiting); }
  select.status.collecting { background: var(--collecting); }
  select.status.training { background: var(--training); }
  select.status.ready { background: var(--ready); }

  .progress-row {
    margin-top: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .progress-row input[type="range"] {
    flex: 1;
    accent-color: var(--hub);
  }
  .progress-row .progress-value {
    font-size: 0.78rem;
    color: var(--text-dim);
    width: 2.6em;
    text-align: right;
    flex-shrink: 0;
  }
  .progress-track {
    position: relative;
    margin-top: 0.35rem;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    background-image: repeating-linear-gradient(to right, rgba(255,255,255,0.18) 0, rgba(255,255,255,0.18) 1px, transparent 1px, transparent 5%);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--hub), var(--ready));
    border-radius: 999px;
  }

  .milestones {
    margin-top: 0.6rem;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }
  .milestone {
    position: relative;
    margin-left: 0.6rem;
    padding: 0.35rem 0.5rem 0.35rem 0.7rem;
    border-left: 2px solid var(--hub);
    background: rgba(99,102,241,0.08);
    border-radius: 0 6px 6px 0;
    font-size: 0.78rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.4rem;
  }
  .milestone .tag {
    color: #a5b4fc;
    font-weight: 700;
    margin-right: 0.35rem;
    white-space: nowrap;
  }

  .overall-gauge {
    max-width: 500px;
    margin: 0 auto 1.5rem;
    text-align: center;
  }
  .overall-gauge .label {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
  }
  .overall-gauge .progress-track {
    height: 14px;
  }

  .subcards {
    margin-top: 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .subcard {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 0.5rem 0.6rem;
  }
  .subcard-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.85rem;
  }
  .subcard select.status {
    margin-top: 0.4rem;
    padding: 0.3rem 0.4rem;
    font-size: 0.75rem;
  }

  .add-row {
    margin-top: 0.7rem;
    display: flex;
    gap: 0.4rem;
  }
  .add-row input {
    flex: 1;
    min-width: 0;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 0.4rem 0.5rem;
    color: var(--text);
    font-size: 0.82rem;
  }
  .add-row button {
    background: #334155;
    border: none;
    border-radius: 8px;
    color: var(--text);
    padding: 0.4rem 0.7rem;
    cursor: pointer;
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .add-row button:hover { background: #475569; }

  .board-footer {
    max-width: 1100px;
    margin: 1.5rem auto 0;
    text-align: center;
  }
  .board-footer button {
    background: var(--hub);
    border: none;
    border-radius: 10px;
    color: white;
    padding: 0.6rem 1.2rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .board-footer button:hover { filter: brightness(1.1); }
</style>
</head>
<body>

<header>
  <h1>Global License Plate Recognition</h1>
  <p>자료: <a href="https://drive.google.com/drive/folders/1aa5icYYXu49iXN-W_SxTPcHbQFaJDgcK" target="_blank" rel="noopener">Google Drive 폴더</a> · 상태는 브라우저에 저장됩니다</p>
</header>

<div class="hub">Global LPR</div>

<div class="overall-gauge">
  <div class="label">전체 완성도 (목표 100) — <span id="overallPct">0%</span></div>
  <div class="progress-track"><div class="progress-fill" id="overallFill" style="width:0%"></div></div>
</div>

<div class="bus-line"></div>

<div class="legend">
  <span style="background:var(--waiting)">대기 중</span>
  <span style="background:var(--collecting)">데이터 확보 중</span>
  <span style="background:var(--training)">학습 준비 중</span>
  <span style="background:var(--ready)">준비 완료</span>
</div>

<div class="board" id="board"></div>

<div class="board-footer">
  <button id="addCardBtn">+ 새 카테고리 카드</button>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "lpr_mindmap_v1";

  var STATUS_LABELS = {
    waiting: "대기 중",
    collecting: "데이터 확보 중",
    training: "학습 준비 중",
    ready: "준비 완료"
  };
  var STATUS_ORDER = ["waiting", "collecting", "training", "ready"];
  var PRIORITY_ORDER = ["한국", "중국", "유럽", "미국"];

  function sortCards(cards) {
    return cards.slice().sort(function (a, b) {
      var ai = PRIORITY_ORDER.indexOf(a.title);
      var bi = PRIORITY_ORDER.indexOf(b.title);
      if (ai !== -1 || bi !== -1) {
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      }
      return a.title.localeCompare(b.title, "ko");
    });
  }

  var DEFAULT_CARDS = [
    "한국",
    "중국",
    "유럽",
    "미국",
    "글로벌 OCR 데이터셋 & 오픈소스 안내서",
    "베트남",
    "북미·남미",
    "아시아",
    "오세아니아",
    "인도",
    "일본",
    "중동·아프리카"
  ].map(function (title) {
    return { id: uid(), title: title, status: "waiting", progress: 0, milestones: [], subcards: [] };
  });

  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { cards: DEFAULT_CARDS };
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.cards)) return { cards: DEFAULT_CARDS };
      parsed.cards.forEach(function (c) {
        if (typeof c.progress !== "number") c.progress = 0;
        if (!Array.isArray(c.milestones)) c.milestones = [];
      });
      return parsed;
    } catch (e) {
      return { cards: DEFAULT_CARDS };
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* storage unavailable, ignore */ }
  }

  var state = load();

  function statusOptionsHtml(current) {
    return STATUS_ORDER.map(function (key) {
      return '<option value="' + key + '"' + (key === current ? " selected" : "") + ">" + STATUS_LABELS[key] + "</option>";
    }).join("");
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function updateOverallGauge() {
    var avg = state.cards.length
      ? Math.round(state.cards.reduce(function (sum, c) { return sum + c.progress; }, 0) / state.cards.length)
      : 0;
    document.getElementById("overallPct").textContent = avg + "%";
    document.getElementById("overallFill").style.width = avg + "%";
  }

  function render() {
    var board = document.getElementById("board");
    board.innerHTML = "";

    sortCards(state.cards).forEach(function (card) {
      var cardEl = document.createElement("div");
      cardEl.className = "card";

      var subcardsHtml = card.subcards.map(function (sub) {
        return (
          '<div class="subcard" data-sub-id="' + sub.id + '">' +
            '<div class="subcard-top">' +
              '<span>' + escapeHtml(sub.title) + '</span>' +
              '<button class="remove-btn" data-action="remove-sub" data-sub="' + sub.id + '">&times;</button>' +
            '</div>' +
            '<select class="status ' + sub.status + '" data-action="sub-status" data-sub="' + sub.id + '">' +
              statusOptionsHtml(sub.status) +
            '</select>' +
          '</div>'
        );
      }).join("");

      var milestonesHtml = card.milestones
        .slice()
        .sort(function (a, b) { return a.percent - b.percent; })
        .map(function (m) {
          return (
            '<div class="milestone">' +
              '<div><span class="tag">' + m.percent + '%</span>' + escapeHtml(m.note) + '</div>' +
              '<button class="remove-btn" data-action="remove-milestone" data-milestone="' + m.id + '">&times;</button>' +
            '</div>'
          );
        }).join("");

      cardEl.innerHTML =
        '<div class="card-top">' +
          '<div class="card-title">' + escapeHtml(card.title) + '</div>' +
          '<button class="remove-btn" data-action="remove-card">&times;</button>' +
        '</div>' +
        '<select class="status ' + card.status + '" data-action="card-status">' +
          statusOptionsHtml(card.status) +
        '</select>' +
        '<div class="progress-row">' +
          '<input type="range" min="0" max="100" value="' + card.progress + '" data-action="card-progress">' +
          '<span class="progress-value">' + card.progress + '%</span>' +
        '</div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + card.progress + '%"></div></div>' +
        '<div class="milestones">' + milestonesHtml + '</div>' +
        '<div class="subcards">' + subcardsHtml + '</div>' +
        '<div class="add-row">' +
          '<input type="text" placeholder="세부 카드 추가" data-role="sub-input">' +
          '<button data-action="add-sub">추가</button>' +
        '</div>';

      cardEl.dataset.cardId = card.id;
      board.appendChild(cardEl);
    });

    updateOverallGauge();
  }

  function findCard(id) {
    return state.cards.find(function (c) { return c.id === id; });
  }

  document.getElementById("board").addEventListener("click", function (e) {
    var target = e.target;
    var action = target.getAttribute("data-action");
    if (!action) return;
    var cardEl = target.closest(".card");
    var cardId = cardEl.dataset.cardId;
    var card = findCard(cardId);
    if (!card) return;

    if (action === "remove-card") {
      if (!confirm('"' + card.title + '" 카드를 삭제할까요?')) return;
      state.cards = state.cards.filter(function (c) { return c.id !== cardId; });
      save();
      render();
    } else if (action === "add-sub") {
      var input = cardEl.querySelector('[data-role="sub-input"]');
      var title = input.value.trim();
      if (!title) return;
      card.subcards.push({ id: uid(), title: title, status: "waiting" });
      input.value = "";
      save();
      render();
    } else if (action === "remove-sub") {
      var subId = target.getAttribute("data-sub");
      card.subcards = card.subcards.filter(function (s) { return s.id !== subId; });
      save();
      render();
    } else if (action === "remove-milestone") {
      var milestoneId = target.getAttribute("data-milestone");
      card.milestones = card.milestones.filter(function (m) { return m.id !== milestoneId; });
      save();
      render();
    }
  });

  document.getElementById("board").addEventListener("input", function (e) {
    var target = e.target;
    if (target.getAttribute("data-action") !== "card-progress") return;
    var cardEl = target.closest(".card");
    var value = Number(target.value);
    cardEl.querySelector(".progress-value").textContent = value + "%";
    cardEl.querySelector(".progress-fill").style.width = value + "%";
  });

  document.getElementById("board").addEventListener("change", function (e) {
    var target = e.target;
    var action = target.getAttribute("data-action");
    if (!action) return;
    var cardEl = target.closest(".card");
    var cardId = cardEl.dataset.cardId;
    var card = findCard(cardId);
    if (!card) return;

    if (action === "card-status") {
      card.status = target.value;
      save();
      render();
    } else if (action === "sub-status") {
      var subId = target.getAttribute("data-sub");
      var sub = card.subcards.find(function (s) { return s.id === subId; });
      if (sub) {
        sub.status = target.value;
        save();
        render();
      }
    } else if (action === "card-progress") {
      var value = Number(target.value);
      card.progress = value;
      if (value > 0 && value % 5 === 0) {
        var already = card.milestones.some(function (m) { return m.percent === value; });
        if (!already) {
          var note = prompt(card.title + " — " + value + "% 달성! 이 지점에서 달성한 내용을 적어주세요 (취소 시 기록하지 않음)");
          if (note && note.trim()) {
            card.milestones.push({ id: uid(), percent: value, note: note.trim() });
          }
        }
      }
      save();
      render();
    }
  });

  document.getElementById("board").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.matches('[data-role="sub-input"]')) {
      e.target.nextElementSibling.click();
    }
  });

  document.getElementById("addCardBtn").addEventListener("click", function () {
    var title = prompt("새 카테고리 이름을 입력하세요");
    if (!title || !title.trim()) return;
    state.cards.push({ id: uid(), title: title.trim(), status: "waiting", progress: 0, milestones: [], subcards: [] });
    save();
    render();
  });

  render();
})();
</script>

</body>
</html>
