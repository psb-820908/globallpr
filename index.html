<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global LPR Mind Map</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1a2540;
    --panel-border: #2c3a5e;
    --text: #f8fafc;
    --text-dim: #94a3b8;
    --hub: #6366f1;
    --waiting: #64748b;
    --collecting: #3b82f6;
    --labeling: #06b6d4;
    --training: #f59e0b;
    --ready: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  body.resizing { user-select: none; }

  header {
    max-width: 640px;
    margin: 0 auto 1.5rem;
    text-align: center;
  }
  header h1 { font-size: 1.5rem; margin: 0 0 0.4rem; }
  header p { color: var(--text-dim); margin: 0 0 0.2rem; font-size: 0.85rem; }
  header a { color: #93c5fd; }
  .hint { font-size: 0.76rem; color: var(--text-dim); }

  .hub {
    max-width: 320px;
    margin: 0 auto 1.5rem;
    background: var(--hub);
    border-radius: 14px;
    padding: 1rem 1.4rem;
    text-align: center;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(99,102,241,0.35);
  }

  .overall-gauge {
    max-width: 640px;
    margin: 0 auto 1.5rem;
    text-align: center;
  }
  .overall-gauge .label {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 0.4rem;
  }
  .overall-gauge .progress-track { height: 14px; }

  .legend {
    max-width: 640px;
    margin: 0 auto 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    justify-content: center;
  }
  .legend span {
    font-size: 0.78rem;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    color: #0f172a;
    font-weight: 600;
  }

  .board {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .card-group {
    position: relative;
    margin-top: 24px;
  }
  .card-group::before {
    content: "";
    position: absolute;
    top: -24px;
    left: 50%;
    width: 2px;
    height: 24px;
    background: var(--panel-border);
  }
  .card-group.dragging-card { opacity: 0.4; }

  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 0.5rem;
    cursor: grab;
    touch-action: none;
  }
  .card-title {
    font-weight: 700;
    font-size: 1rem;
    line-height: 1.3;
  }
  .remove-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 0.1rem 0.3rem;
    flex-shrink: 0;
  }
  .remove-btn:hover { color: #f87171; }

  .card-body { flex: 1; overflow: auto; }

  select.status {
    margin-top: 0.6rem;
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 0.4rem 0.5rem;
    font-size: 0.82rem;
    font-weight: 600;
    color: #0f172a;
    cursor: pointer;
  }
  select.status.waiting { background: var(--waiting); }
  select.status.collecting { background: var(--collecting); }
  select.status.labeling { background: var(--labeling); }
  select.status.training { background: var(--training); }
  select.status.ready { background: var(--ready); }

  .progress-header {
    margin-top: 0.6rem;
    display: flex;
    justify-content: flex-end;
  }
  .top-btn {
    background: rgba(99,102,241,0.15);
    border: 1px solid var(--hub);
    color: #c7d2fe;
    border-radius: 999px;
    padding: 0.2rem 0.6rem;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .top-btn:hover { background: rgba(99,102,241,0.3); }

  .progress-row {
    margin-top: 0.4rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .progress-row input[type="range"] {
    flex: 1;
    accent-color: var(--hub);
  }
  .progress-row .progress-value {
    font-size: 0.78rem;
    color: var(--text-dim);
    width: 2.6em;
    text-align: right;
    flex-shrink: 0;
  }
  .progress-track-wrap {
    position: relative;
    margin-top: 0.35rem;
    padding-bottom: 1.9rem;
  }
  .progress-track {
    position: relative;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    background-image: repeating-linear-gradient(to right, rgba(255,255,255,0.18) 0, rgba(255,255,255,0.18) 1px, transparent 1px, transparent 5%);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--hub), var(--ready));
    border-radius: 999px;
  }
  .mark-btn {
    position: absolute;
    top: 100%;
    margin-top: 6px;
    transform: translate(-50%, 0);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--hub);
    color: #fff;
    border: none;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(99,102,241,0.5);
    z-index: 2;
  }
  .mark-btn:hover { filter: brightness(1.15); }
  .mark-form {
    position: absolute;
    top: 100%;
    margin-top: 4px;
    transform: translate(-50%, 0);
    display: flex;
    gap: 0.3rem;
    background: var(--panel);
    border: 1px solid var(--hub);
    border-radius: 8px;
    padding: 0.35rem;
    z-index: 3;
    width: max-content;
    max-width: 240px;
  }
  .mark-form input {
    width: 140px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 0.3rem 0.4rem;
    color: var(--text);
    font-size: 0.78rem;
  }
  .mark-form button {
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.78rem;
    padding: 0.3rem 0.5rem;
  }
  .mark-form .confirm { background: var(--ready); color: #0f172a; font-weight: 700; }
  .mark-form .cancel { background: #334155; color: var(--text); }

  .branch {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .branch-stem {
    width: 2px;
    height: 18px;
    background: var(--panel-border);
  }
  .branch-nodes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.9rem 1rem;
    width: 100%;
    padding-top: 18px;
    border-top: 2px solid var(--panel-border);
  }
  .milestone-node {
    position: relative;
    max-width: 190px;
    background: rgba(99,102,241,0.1);
    border: 1px solid var(--hub);
    border-radius: 10px;
    padding: 0.5rem 0.6rem;
    font-size: 0.78rem;
    text-align: left;
  }
  .milestone-node::before {
    content: "";
    position: absolute;
    top: -18px;
    left: 50%;
    width: 2px;
    height: 18px;
    background: var(--panel-border);
  }
  .milestone-node .tag {
    display: block;
    color: #a5b4fc;
    font-weight: 700;
    margin-bottom: 0.2rem;
  }
  .milestone-node .remove-btn {
    position: absolute;
    top: 0.1rem;
    right: 0.2rem;
  }

  .resize-handle {
    align-self: center;
    width: 40px;
    height: 10px;
    margin-top: 0.5rem;
    cursor: ns-resize;
    touch-action: none;
    position: relative;
  }
  .resize-handle::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 32px;
    height: 3px;
    background: var(--panel-border);
    border-radius: 999px;
    transform: translate(-50%, -50%);
  }

  .board-footer {
    max-width: 420px;
    margin: 1.5rem auto 0;
    text-align: center;
  }
  .board-footer button {
    background: var(--hub);
    border: none;
    border-radius: 10px;
    color: white;
    padding: 0.6rem 1.2rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .board-footer button:hover { filter: brightness(1.1); }
</style>
</head>
<body>

<header>
  <h1>Global License Plate Recognition</h1>
  <p class="hint">카드 제목을 드래그해서 순서를 바꾸고, 카드 아래 손잡이를 끌어서 높이를 조절할 수 있습니다.</p>
</header>

<div class="hub">Global LPR</div>

<div class="overall-gauge">
  <div class="label">전체 완성도 (목표 100) — <span id="overallPct">0%</span></div>
  <div class="progress-track"><div class="progress-fill" id="overallFill" style="width:0%"></div></div>
</div>

<div class="legend">
  <span style="background:var(--waiting)">대기 중</span>
  <span style="background:var(--collecting)">데이터 확보 중</span>
  <span style="background:var(--labeling)">라벨링 대기</span>
  <span style="background:var(--training)">학습 준비 중</span>
  <span style="background:var(--ready)">준비 완료</span>
</div>

<div class="board" id="board"></div>

<div class="board-footer">
  <button id="addCardBtn">+ 새 카테고리 카드</button>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "lpr_mindmap_v3";

  var STATUS_LABELS = {
    waiting: "대기 중",
    collecting: "데이터 확보 중",
    labeling: "라벨링 대기",
    training: "학습 준비 중",
    ready: "준비 완료"
  };
  var STATUS_ORDER = ["waiting", "collecting", "labeling", "training", "ready"];
  var PRIORITY_ORDER = ["한국", "중국", "유럽", "미국"];
  var DEFAULT_HEIGHT = 0; // 0 = auto height

  var DEFAULT_TITLES = [
    "한국", "중국", "유럽", "미국",
    "글로벌 OCR 데이터셋 & 오픈소스 안내서",
    "베트남", "북미·남미", "아시아",
    "오세아니아", "인도", "일본", "중동·아프리카"
  ];

  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }

  function sortByPriority(titles) {
    return titles.slice().sort(function (a, b) {
      var ai = PRIORITY_ORDER.indexOf(a);
      var bi = PRIORITY_ORDER.indexOf(b);
      if (ai !== -1 || bi !== -1) {
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      }
      return a.localeCompare(b, "ko");
    });
  }

  function makeDefaultCard(title) {
    return {
      id: uid(),
      title: title,
      status: "waiting",
      progress: 0,
      height: DEFAULT_HEIGHT,
      milestones: []
    };
  }

  function defaultState() {
    return { cards: sortByPriority(DEFAULT_TITLES).map(makeDefaultCard) };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.cards)) return defaultState();
      parsed.cards.forEach(function (c) {
        if (typeof c.progress !== "number") c.progress = 0;
        if (typeof c.height !== "number") c.height = DEFAULT_HEIGHT;
        if (!Array.isArray(c.milestones)) c.milestones = [];
      });
      return parsed;
    } catch (e) {
      return defaultState();
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* storage unavailable, ignore */ }
  }

  var state = load();

  function statusOptionsHtml(current) {
    return STATUS_ORDER.map(function (key) {
      return '<option value="' + key + '"' + (key === current ? " selected" : "") + ">" + STATUS_LABELS[key] + "</option>";
    }).join("");
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function updateOverallGauge() {
    var avg = state.cards.length
      ? Math.round(state.cards.reduce(function (sum, c) { return sum + c.progress; }, 0) / state.cards.length)
      : 0;
    document.getElementById("overallPct").textContent = avg + "%";
    document.getElementById("overallFill").style.width = avg + "%";
  }

  function findCard(id) {
    return state.cards.find(function (c) { return c.id === id; });
  }

  function moveCardToTop(id) {
    var idx = state.cards.findIndex(function (c) { return c.id === id; });
    if (idx <= 0) return;
    var card = state.cards.splice(idx, 1)[0];
    state.cards.unshift(card);
  }

  var board = document.getElementById("board");
  var draggedEl = null;

  // transient (not persisted) UI state for the "reached a 5% mark" button/form
  var pendingMarks = {}; // cardId -> percent waiting for a "+" button
  var openMarkForms = {}; // cardId -> percent currently being typed into

  function reorderStateFromDom() {
    var ids = Array.prototype.map.call(board.querySelectorAll(".card-group"), function (el) {
      return el.dataset.cardId;
    });
    state.cards.sort(function (a, b) { return ids.indexOf(a.id) - ids.indexOf(b.id); });
  }

  function render() {
    board.innerHTML = "";

    state.cards.forEach(function (card) {
      var groupEl = document.createElement("div");
      groupEl.className = "card-group";
      groupEl.dataset.cardId = card.id;
      groupEl.draggable = true;

      var cardEl = document.createElement("div");
      cardEl.className = "card";
      if (card.height > 0) cardEl.style.height = card.height + "px";

      var sortedMilestones = card.milestones.slice().sort(function (a, b) { return a.percent - b.percent; });
      var milestoneNodesHtml = sortedMilestones.map(function (m) {
        return (
          '<div class="milestone-node">' +
            '<span class="tag">' + m.percent + '%</span>' +
            escapeHtml(m.note) +
            '<button class="remove-btn" data-action="remove-milestone" data-milestone="' + m.id + '">&times;</button>' +
          '</div>'
        );
      }).join("");

      var markPercent = openMarkForms.hasOwnProperty(card.id) ? openMarkForms[card.id] : pendingMarks[card.id];
      var markHtml = "";
      if (typeof markPercent === "number") {
        if (openMarkForms.hasOwnProperty(card.id)) {
          markHtml =
            '<div class="mark-form" style="left:' + markPercent + '%">' +
              '<input type="text" placeholder="' + markPercent + '% 달성 내용" data-role="mark-input" data-percent="' + markPercent + '">' +
              '<button class="confirm" data-action="mark-confirm" data-percent="' + markPercent + '">✓</button>' +
              '<button class="cancel" data-action="mark-cancel">&times;</button>' +
            '</div>';
        } else {
          markHtml =
            '<button class="mark-btn" style="left:' + markPercent + '%" data-action="mark-open" data-percent="' + markPercent + '" title="' + markPercent + '% 달성 기록 추가">+</button>';
        }
      }

      cardEl.innerHTML =
        '<div class="card-top">' +
          '<div class="card-title">' + escapeHtml(card.title) + '</div>' +
          '<button class="remove-btn" data-action="remove-card">&times;</button>' +
        '</div>' +
        '<div class="card-body">' +
          '<select class="status ' + card.status + '" data-action="card-status">' +
            statusOptionsHtml(card.status) +
          '</select>' +
          '<div class="progress-header">' +
            '<button class="top-btn" data-action="move-top">▲ 맨 위로</button>' +
          '</div>' +
          '<div class="progress-row">' +
            '<input type="range" min="0" max="100" value="' + card.progress + '" data-action="card-progress">' +
            '<span class="progress-value">' + card.progress + '%</span>' +
          '</div>' +
          '<div class="progress-track-wrap">' +
            '<div class="progress-track"><div class="progress-fill" style="width:' + card.progress + '%"></div></div>' +
            markHtml +
          '</div>' +
        '</div>' +
        '<div class="resize-handle" data-role="resize"></div>';

      groupEl.appendChild(cardEl);

      if (sortedMilestones.length > 0) {
        var branchEl = document.createElement("div");
        branchEl.className = "branch";
        branchEl.innerHTML =
          '<div class="branch-stem"></div>' +
          '<div class="branch-nodes">' + milestoneNodesHtml + '</div>';
        groupEl.appendChild(branchEl);
      }

      board.appendChild(groupEl);
    });

    updateOverallGauge();
  }

  // ---- drag to reorder (HTML5 DnD) ----
  board.addEventListener("dragstart", function (e) {
    var handle = e.target.closest(".card-top");
    var groupEl = e.target.closest(".card-group");
    if (!handle || !groupEl) { e.preventDefault(); return; }
    draggedEl = groupEl;
    groupEl.classList.add("dragging-card");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", groupEl.dataset.cardId);
  });

  board.addEventListener("dragover", function (e) {
    var targetEl = e.target.closest(".card-group");
    if (!draggedEl || !targetEl || targetEl === draggedEl) return;
    e.preventDefault();
    var rect = targetEl.getBoundingClientRect();
    var before = (e.clientY - rect.top) / rect.height < 0.5;
    board.insertBefore(draggedEl, before ? targetEl : targetEl.nextSibling);
  });

  board.addEventListener("dragend", function () {
    if (!draggedEl) return;
    draggedEl.classList.remove("dragging-card");
    draggedEl = null;
    reorderStateFromDom();
    save();
  });

  // ---- resize handle (height) ----
  board.addEventListener("pointerdown", function (e) {
    var handle = e.target.closest('[data-role="resize"]');
    if (!handle) return;
    e.preventDefault();
    var cardEl = handle.closest(".card");
    var groupEl = handle.closest(".card-group");
    var card = findCard(groupEl.dataset.cardId);
    if (!card) return;
    var startY = e.clientY;
    var startHeight = cardEl.getBoundingClientRect().height;
    handle.setPointerCapture(e.pointerId);
    document.body.classList.add("resizing");

    function onMove(ev) {
      var newHeight = Math.max(140, startHeight + (ev.clientY - startY));
      cardEl.style.height = newHeight + "px";
    }
    function onUp() {
      handle.removeEventListener("pointermove", onMove);
      handle.removeEventListener("pointerup", onUp);
      document.body.classList.remove("resizing");
      card.height = cardEl.getBoundingClientRect().height;
      save();
    }
    handle.addEventListener("pointermove", onMove);
    handle.addEventListener("pointerup", onUp);
  });

  // ---- card content interactions ----
  board.addEventListener("click", function (e) {
    var target = e.target;
    var action = target.getAttribute("data-action");
    if (!action) return;
    var groupEl = target.closest(".card-group");
    if (!groupEl) return;
    var card = findCard(groupEl.dataset.cardId);
    if (!card) return;
    var cardEl = groupEl.querySelector(".card");

    if (action === "remove-card") {
      if (!confirm('"' + card.title + '" 카드를 삭제할까요?')) return;
      state.cards = state.cards.filter(function (c) { return c.id !== card.id; });
      save();
      render();
    } else if (action === "remove-milestone") {
      var milestoneId = target.getAttribute("data-milestone");
      card.milestones = card.milestones.filter(function (m) { return m.id !== milestoneId; });
      save();
      render();
    } else if (action === "move-top") {
      moveCardToTop(card.id);
      save();
      render();
    } else if (action === "mark-open") {
      var openPercent = Number(target.getAttribute("data-percent"));
      openMarkForms[card.id] = openPercent;
      render();
      var reopened = board.querySelector('[data-role="mark-input"]');
      if (reopened) reopened.focus();
    } else if (action === "mark-cancel") {
      delete openMarkForms[card.id];
      render();
    } else if (action === "mark-confirm") {
      var confirmPercent = Number(target.getAttribute("data-percent"));
      var noteInput = cardEl.querySelector('[data-role="mark-input"]');
      var noteText = noteInput ? noteInput.value.trim() : "";
      if (!noteText) { noteInput && noteInput.focus(); return; }
      card.milestones.push({ id: uid(), percent: confirmPercent, note: noteText });
      delete pendingMarks[card.id];
      delete openMarkForms[card.id];
      moveCardToTop(card.id);
      save();
      render();
    }
  });

  board.addEventListener("input", function (e) {
    var target = e.target;
    if (target.getAttribute("data-action") !== "card-progress") return;
    var cardEl = target.closest(".card");
    var value = Number(target.value);
    cardEl.querySelector(".progress-value").textContent = value + "%";
    cardEl.querySelector(".progress-fill").style.width = value + "%";
  });

  board.addEventListener("change", function (e) {
    var target = e.target;
    var action = target.getAttribute("data-action");
    if (!action) return;
    var groupEl = target.closest(".card-group");
    if (!groupEl) return;
    var card = findCard(groupEl.dataset.cardId);
    if (!card) return;

    if (action === "card-status") {
      card.status = target.value;
      save();
      render();
    } else if (action === "card-progress") {
      var value = Number(target.value);
      card.progress = value;
      if (value > 0 && value % 5 === 0 && !card.milestones.some(function (m) { return m.percent === value; })) {
        pendingMarks[card.id] = value;
      } else {
        delete pendingMarks[card.id];
      }
      save();
      render();
    }
  });

  board.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.matches('[data-role="mark-input"]')) {
      e.target.parentElement.querySelector(".confirm").click();
    } else if (e.key === "Escape" && e.target.matches('[data-role="mark-input"]')) {
      e.target.parentElement.querySelector(".cancel").click();
    }
  });

  document.getElementById("addCardBtn").addEventListener("click", function () {
    var title = prompt("새 카테고리 이름을 입력하세요");
    if (!title || !title.trim()) return;
    state.cards.push(makeDefaultCard(title.trim()));
    save();
    render();
  });

  render();
})();
</script>
